- name: Debug CurseForge response
  run: |
    node -e "
    const https = require('https');
    const fs = require('fs');
    
    const options = {
      headers: {
        'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
        'Accept-Language': 'en-US,en;q=0.5',
      }
    };
    
    https.get('https://www.curseforge.com/minecraft/mc-mods/hydrogenfps', options, (res) => {
      console.log('Status:', res.statusCode);
      console.log('Headers:', JSON.stringify(res.headers, null, 2));
      
      let data = '';
      res.on('data', chunk => data += chunk);
      res.on('end', () => {
        // Save full HTML to examine
        fs.writeFileSync('debug.html', data);
        console.log('Saved debug.html (' + data.length + ' bytes)');
        
        // Show key parts
        console.log('\n--- First 1000 chars ---');
        console.log(data.substring(0, 1000));
        
        console.log('\n--- Script tags ---');
        const scripts = data.match(/<script[^>]*>/g);
        console.log('Found ' + (scripts ? scripts.length : 0) + ' script tags');
        
        console.log('\n--- H1 tags ---');
        const h1 = data.match(/<h1[^>]*>(.*?)<\/h1>/g);
        console.log(h1 ? h1.join('\n') : 'No H1 found');
        
        console.log('\n--- Download-related content ---');
        const dlLines = data.split('\n').filter(line => 
          line.toLowerCase().includes('download')
        );
        console.log('Found ' + dlLines.length + ' lines with "download"');
        dlLines.slice(0, 10).forEach(line => console.log(line.substring(0, 200)));
      });
    }).on('error', (err) => {
      console.error('Request failed:', err.message);
    });
    "
    
  - name: Upload debug output
    uses: actions/upload-artifact@v4
    if: always()
    with:
      name: debug-html
      path: debug.html
