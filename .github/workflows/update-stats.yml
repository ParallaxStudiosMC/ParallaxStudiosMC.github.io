name: Update CurseForge Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode (save HTML)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CurseForge stats
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          const debug = process.env.DEBUG_MODE === 'true';
          
          const slugs = ['hydrogenfps', 'never-alone', 'weyes', 'dv', 'the-shadow-stalker-horror'];
          const results = [];
          
          function apiRequest(url, options = {}) {
            return new Promise((resolve, reject) => {
              const urlObj = new URL(url);
              const reqOptions = {
                hostname: urlObj.hostname,
                path: urlObj.pathname + urlObj.search,
                method: options.method || 'GET',
                headers: {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'application/json, text/plain, */*',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Referer': 'https://www.curseforge.com/minecraft/mc-mods',
                  'Origin': 'https://www.curseforge.com',
                  ...options.headers
                },
                timeout: 15000
              };
              
              const req = https.request(reqOptions, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 400) {
                    return reject(new Error('HTTP ' + res.statusCode + ': ' + data.substring(0, 200)));
                  }
                  
                  try {
                    const json = JSON.parse(data);
                    resolve(json);
                  } catch (e) {
                    if (debug) {
                      console.log('Response preview:', data.substring(0, 500));
                    }
                    resolve({ _raw: data, _status: res.statusCode });
                  }
                });
              });
              
              req.on('error', reject);
              req.on('timeout', () => {
                req.destroy();
                reject(new Error('Timeout'));
              });
              
              if (options.body) {
                req.write(options.body);
              }
              req.end();
            });
          }
          
          async function getModStats(slug) {
            console.log('\n📦 Fetching: ' + slug);
            const methods = [
              // Method 1: GraphQL endpoint (internal API)
              async () => {
                const query = JSON.stringify({
                  query: \`query getMod(\$slug: String) {
                    mod(slug: \$slug) {
                      id
                      name
                      slug
                      downloadCount
                      summary
                      game { name }
                      authors { name }
                      links { websiteUrl }
                    }
                  }\`,
                  variables: { slug: slug }
                });
                
                const response = await apiRequest('https://www.curseforge.com/graphql', {
                  method: 'POST',
                  body: query,
                  headers: {
                    'Content-Type': 'application/json',
                    'Referer': 'https://www.curseforge.com/minecraft/mc-mods/' + slug
                  }
                });
                
                if (response?.data?.mod) {
                  const mod = response.data.mod;
                  return {
                    name: mod.name,
                    downloads: mod.downloadCount,
                    slug: mod.slug,
                    game: mod.game?.name
                  };
                }
                return null;
              },
              
              // Method 2: ForgeSVC legacy API
              async () => {
                const response = await apiRequest(
                  'https://addons-ecs.forgesvc.net/api/v2/addon/search?gameId=432&searchFilter=' + encodeURIComponent(slug) + '&pageSize=25'
                );
                
                if (Array.isArray(response)) {
                  const mod = response.find(m => m.slug === slug || m.websiteUrl?.includes(slug));
                  if (mod) {
                    return {
                      name: mod.name,
                      downloads: mod.downloadCount || mod.totalDownloadCount || 0,
                      slug: mod.slug || slug,
                      authors: mod.authors?.map(a => a.name)
                    };
                  }
                }
                return null;
              },
              
              // Method 3: Scrape the page (as last resort)
              async () => {
                const url = 'https://www.curseforge.com/minecraft/mc-mods/' + slug;
                const result = await apiRequest(url);
                
                if (result._raw) {
                  const html = result._raw;
                  
                  if (debug) {
                    fs.writeFileSync('debug-' + slug + '.html', html);
                    console.log('  💾 Saved debug-' + slug + '.html');
                  }
                  
                  // Try to extract from Next.js props
                  const nextDataMatch = html.match(/<script[^>]*id="__NEXT_DATA__"[^>]*type="application\/json"[^>]*>([^<]+)<\/script>/);
                  if (nextDataMatch) {
                    const nextData = JSON.parse(nextDataMatch[1]);
                    const pageProps = nextData?.props?.pageProps;
                    const project = pageProps?.project || pageProps?.mod;
                    
                    if (project) {
                      return {
                        name: project.name || project.title,
                        downloads: project.downloadCount || project.downloads?.total,
                        slug: project.slug || slug
                      };
                    }
                  }
                  
                  // Try regex fallback
                  const nameMatch = html.match(/<h1[^>]*class="[^"]*project-title[^"]*"[^>]*>([^<]+)<\/h1>/i) ||
                                   html.match(/<meta\s+property="og:title"\s+content="([^"]+)"/i);
                  const dlMatch = html.match(/\"downloadCount\":\s*(\d+)/) ||
                                 html.match(/\"downloads\":\s*(\d+)/) ||
                                 html.match(/(\d[\d,]*)\s+total\s+downloads/i) ||
                                 html.match(/(\d[\d,]+)\s+Downloads/i);
                  
                  if (nameMatch && dlMatch) {
                    return {
                      name: nameMatch[1].replace(/\s*-\s*Minecraft.*$/, '').trim(),
                      downloads: parseInt(dlMatch[1].replace(/,/g, '')),
                      slug: slug
                    };
                  }
                }
                return null;
              }
            ];
            
            for (let i = 0; i < methods.length; i++) {
              try {
                console.log('  Trying method ' + (i + 1) + '...');
                const result = await methods[i]();
                if (result && result.name && result.downloads !== undefined) {
                  console.log('  ✅ Success via method ' + (i + 1) + ': ' + result.name + ' - ' + Number(result.downloads).toLocaleString() + ' downloads');
                  return result;
                }
              } catch (err) {
                console.log('  ❌ Method ' + (i + 1) + ' failed: ' + err.message);
              }
              // Small delay between methods
              await new Promise(r => setTimeout(r, 500));
            }
            
            console.log('  💀 All methods failed for: ' + slug);
            return null;
          }
          
          async function main() {
            console.log('🚀 CurseForge Stats Scraper v3.0');
            console.log('=' .repeat(50));
            console.log('Targets:', slugs.join(', '));
            console.log('Debug mode:', debug ? 'ON' : 'OFF');
            console.log('');
            
            for (const slug of slugs) {
              const stats = await getModStats(slug);
              
              if (stats) {
                results.push({
                  ...stats,
                  timestamp: new Date().toISOString()
                });
              }
              
              // Rate limiting between mods
              if (slugs.indexOf(slug) < slugs.length - 1) {
                const delay = 1500 + Math.random() * 2500;
                console.log('  ⏳ Waiting ' + Math.round(delay) + 'ms...');
                await new Promise(r => setTimeout(r, delay));
              }
            }
            
            console.log('\n' + '='.repeat(50));
            
            if (results.length === 0) {
              console.error('❌ COMPLETE FAILURE: No data fetched for any mod!');
              console.error('Try running with debug mode enabled (workflow_dispatch)');
              process.exit(1);
            }
            
            // Save results
            const output = {
              lastUpdated: new Date().toISOString(),
              mods: results,
              summary: {
                total: results.length,
                succeeded: results.length,
                failed: slugs.length - results.length
              }
            };
            
            fs.writeFileSync('stats.json', JSON.stringify(output, null, 2));
            console.log('✅ SUCCESS: Saved stats.json');
            console.log('📊 Results:');
            results.forEach(r => {
              console.log('  • ' + r.name + ': ' + Number(r.downloads).toLocaleString() + ' downloads');
            });
            
            // Save debug info if any mods failed
            if (results.length < slugs.length) {
              const failed = slugs.filter(s => !results.find(r => r.slug === s));
              console.log('\n⚠️  Failed mods: ' + failed.join(', '));
              fs.writeFileSync('failed-slugs.json', JSON.stringify(failed, null, 2));
            }
          }
          
          main().catch(err => {
            console.error('💥 Crash:', err.message);
            console.error(err.stack);
            process.exit(1);
          });
          "
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}

      - name: Upload debug artifacts
        if: ${{ github.event.inputs.debug == 'true' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-files
          path: debug-*.html
          retention-days: 7

      - name: Commit and push stats.json
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stats.json
          if [ -f "failed-slugs.json" ]; then
            git add failed-slugs.json
          fi
          git diff --cached --quiet || git commit -m "chore: update CurseForge stats [skip ci]"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Workflow failed!"
          echo "Stats update failed at $(date)"
          # Create an issue or send notification here if needed
          exit 1
