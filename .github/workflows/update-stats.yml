name: Update CurseForge Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CurseForge stats
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          
          const slugs = ['hydrogenfps', 'never-alone', 'weyes', 'dv', 'the-shadow-stalker-horror'];
          const results = [];
          
          function fetchWithRedirects(url, maxRedirects = 5) {
            return new Promise((resolve, reject) => {
              const options = {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.5',
                  'Accept-Encoding': 'gzip, deflate',
                  'Connection': 'keep-alive',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache'
                },
                timeout: 15000
              };
              
              const req = https.get(url, options, (res) => {
                // Handle redirects
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location && maxRedirects > 0) {
                  console.log('  ↳ Redirected to:', res.headers.location);
                  return resolve(fetchWithRedirects(res.headers.location, maxRedirects - 1));
                }
                
                if (res.statusCode !== 200) {
                  return reject(new Error('HTTP ' + res.statusCode));
                }
                
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              });
              
              req.on('error', reject);
              req.on('timeout', () => {
                req.destroy();
                reject(new Error('Request timeout'));
              });
              
              req.end();
            });
          }
          
          function extractModData(html, slug) {
            // Method 1: Look for Next.js data (most reliable)
            const nextDataMatch = html.match(/<script[^>]*id=\"__NEXT_DATA__\"[^>]*type=\"application\/json\"[^>]*>([^<]+)<\/script>/);
            if (nextDataMatch) {
              try {
                const nextData = JSON.parse(nextDataMatch[1]);
                const pageProps = nextData?.props?.pageProps;
                if (pageProps?.project) {
                  const project = pageProps.project;
                  return {
                    name: project.name || project.title,
                    downloads: project.downloadCount || project.downloads?.total,
                    id: project.id
                  };
                }
              } catch (e) {
                console.log('  ↳ Next.js JSON parse failed, trying alternatives...');
              }
            }
            
            // Method 2: JSON-LD structured data
            const jsonLdMatch = html.match(/<script[^>]*type=\"application\/ld\+json\"[^>]*>([^<]+)<\/script>/);
            if (jsonLdMatch) {
              try {
                const jsonLd = JSON.parse(jsonLdMatch[1]);
                if (jsonLd.name) {
                  // Downloads often appear in the page elsewhere
                  const dlMatch = html.match(/downloadCount[^:]*:\s*(\d+)/i) ||
                                  html.match(/\"downloads\"[^:]*:\s*(\d+)/i) ||
                                  html.match(/\"downloadCount\"[^:]*:\s*(\d+)/i);
                  return {
                    name: jsonLd.name,
                    downloads: dlMatch ? parseInt(dlMatch[1]) : null,
                    id: jsonLd.identifier
                  };
                }
              } catch (e) {
                console.log('  ↳ JSON-LD parse failed, trying alternatives...');
              }
            }
            
            // Method 3: Direct regex extraction
            const nameMatch = html.match(/<meta\s+property=\"og:title\"\s+content=\"([^\"]+)\"/) ||
                             html.match(/<title>([^<]+)<\/title>/);
            const dlPatterns = [
              /downloadCount[^:]*:\s*(\d+)/i,
              /\"downloads\"[^:]*:\s*(\d+)/i,
              /\"downloadCount\"[^:]*:\s*(\d+)/i,
              /(\d[\d,]*)\s+Downloads/i,
              /Total Downloads[^<]*<[^>]*>\s*<[^>]*>\s*<[^>]*>([\d,]+)/i
            ];
            
            let downloads = null;
            for (const pattern of dlPatterns) {
              const match = html.match(pattern);
              if (match) {
                downloads = parseInt(match[1].replace(/,/g, ''));
                break;
              }
            }
            
            if (nameMatch) {
              const name = nameMatch[1].replace(/\s*-\s*Minecraft\s*Mods?\s*-\s*CurseForge.*$/i, '').trim();
              return { name, downloads, id: null };
            }
            
            return null;
          }
          
          async function fetchMod(slug, retries = 3) {
            const url = 'https://www.curseforge.com/minecraft/mc-mods/' + slug;
            
            for (let i = 0; i < retries; i++) {
              try {
                if (i > 0) {
                  console.log('  ↳ Retry ' + (i + 1) + '/' + retries + '...');
                  await new Promise(r => setTimeout(r, 3000 * (i + 1)));
                }
                
                const html = await fetchWithRedirects(url);
                const data = extractModData(html, slug);
                
                if (data && data.name) {
                  if (data.downloads === null) {
                    console.warn('  ↳ Warning: Could not extract download count for ' + data.name);
                  }
                  return data;
                }
                
                console.warn('  ↳ Warning: Could not extract data for ' + slug);
                return null;
                
              } catch (err) {
                console.error('  ↳ Attempt ' + (i + 1) + ' failed:', err.message);
                if (i === retries - 1) return null;
              }
            }
          }
          
          async function main() {
            console.log('Starting CurseForge stats scraper...\n');
            
            for (const slug of slugs) {
              console.log('Processing: ' + slug);
              const data = await fetchMod(slug);
              
              if (data && data.name) {
                results.push({
                  name: data.name,
                  downloads: data.downloads || 'unknown',
                  slug: slug,
                  timestamp: new Date().toISOString()
                });
                console.log('  ✓ ' + data.name + ': ' + (data.downloads || 'unknown').toLocaleString() + ' downloads');
              } else {
                console.error('  ✗ Failed to get data for: ' + slug);
              }
              
              // Rate limiting - be nice to their servers
              await new Promise(r => setTimeout(r, 2000 + Math.random() * 3000));
            }
            
            if (results.length === 0) {
              console.error('\n❌ No data was fetched!');
              process.exit(1);
            }
            
            // Save results
            fs.writeFileSync('stats.json', JSON.stringify(results, null, 2));
            console.log('\n✅ Successfully saved stats.json with ' + results.length + ' mods');
            console.log('Stats:', JSON.stringify(results, null, 2));
          }
          
          main().catch(err => {
            console.error('\n💥 Fatal error:', err.message);
            process.exit(1);
          });
          "

      - name: Commit and push stats.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: update CurseForge stats [skip ci]"
          git push
